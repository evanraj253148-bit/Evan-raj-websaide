<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evan Raj | Personal Website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050807;
      color: #00ff66;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 16px;
    }

    .card {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px 20px;
      border: 1px solid #00ff66;
      border-radius: 15px;
      box-shadow: 0 0 20px #00ff6633;
    }

    h1 {
      text-shadow: 0 0 12px #00ff66;
    }

    p {
      color: #d0d0d0;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      color: #00ff66;
      border: 1px solid #00ff66;
      padding: 12px 18px;
      margin: 8px;
      border-radius: 8px;
      text-decoration: none;
    }

    a:hover {
      background: #00ff66;
      color: #050807;
    }

    footer {
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>EVAN RAJ</h1>
    <h3>Welcome to My Website</h3>
    <p>
      Hello! I am Evan Raj.<br>
      Developer, Learner and Dreamer.
    </p>
    <p>Welcome to my personal website!</p>

    <a href="https://github.com/evanraj253148-bit">
      My GitHub
    </a>
  </div>

  <footer>© 2026 Evan Raj</footer>
</body>
</html>
